{{- if .Values.secrets.externalSecret.enabled }}
{{- $secretName := .Values.secrets.existingSecretName | default .Values.global.existingSecretName | default (printf "%s-secrets" (include "stayly.fullname" .)) }}
{{- $eso := .Values.secrets.externalSecret }}
---
# Syncs real credentials from AWS Secrets Manager into the cluster Secret
# using the External Secrets Operator (IRSA: role stayly-external-secrets).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $eso.storeName }}
  labels: {{ include "stayly.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $eso.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $eso.serviceAccountName }}
            namespace: {{ $eso.serviceAccountNamespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "stayly.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $eso.storeName }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ "{{ .DATABASE_URL }}" | quote }}
        VITE_CLERK_PUBLISHABLE_KEY: {{ "{{ .VITE_CLERK_PUBLISHABLE_KEY }}" | quote }}
        CLOUDINARY_CLOUD_NAME: {{ "{{ .CLOUDINARY_CLOUD_NAME }}" | quote }}
        CLOUDINARY_API_KEY: {{ "{{ .CLOUDINARY_API_KEY }}" | quote }}
        CLOUDINARY_API_SECRET: {{ "{{ .CLOUDINARY_API_SECRET }}" | quote }}
        ADMIN_PASSWORD: {{ "{{ .ADMIN_PASSWORD }}" | quote }}
        CLERK_SECRET_KEY: {{ "{{ .CLERK_SECRET_KEY }}" | quote }}
        # The app database is Neon (see DATABASE_URL in the AWS secret);
        # this key only satisfies the in-cluster postgres StatefulSet env.
        POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: DATABASE_URL
    - secretKey: VITE_CLERK_PUBLISHABLE_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: VITE_CLERK_PUBLISHABLE_KEY
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_CLOUD_NAME
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_API_KEY
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLOUDINARY_API_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: ADMIN_PASSWORD
    - secretKey: CLERK_SECRET_KEY
      remoteRef:
        key: {{ $eso.remoteKey }}
        property: CLERK_SECRET_KEY
{{- end }}
