{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecretName | default .Values.global.existingSecretName | default (printf "%s-secrets" (include "stayly.fullname" .)) }}
  namespace: {{ .Values.namespace }}
  labels: {{ include "stayly.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: "{{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword }}"
  DATABASE_URL: "{{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl }}"
  CLOUDINARY_CLOUD_NAME: "{{ required "secrets.cloudinaryCloudName is required when secrets.create=true" .Values.secrets.cloudinaryCloudName }}"
  CLOUDINARY_API_KEY: "{{ required "secrets.cloudinaryApiKey is required when secrets.create=true" .Values.secrets.cloudinaryApiKey }}"
  CLOUDINARY_API_SECRET: "{{ required "secrets.cloudinaryApiSecret is required when secrets.create=true" .Values.secrets.cloudinaryApiSecret }}"
  ADMIN_PASSWORD: "{{ required "secrets.adminPassword is required when secrets.create=true" .Values.secrets.adminPassword }}"
  CLERK_SECRET_KEY: "{{ .Values.secrets.clerkSecretKey }}"
{{- end }}
