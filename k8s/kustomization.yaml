apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stayly

resources:
  - namespace.yaml
  - configmap.yaml
  - external-secret.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml

# Default tag for local clusters (minikube/kind). Push to a registry and
# override per environment, e.g.:
#   kustomize edit set image stayly-frontend:latest=ghcr.io/<org>/stayly-frontend:<tag>
images:
  - name: stayly-frontend
    newTag: latest
  - name: stayly-backend
    newTag: latest
