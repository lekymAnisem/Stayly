apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stayly
  namespace: stayly
  labels:
    app.kubernetes.io/name: stayly
    app.kubernetes.io/part-of: stayly
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: stayly.local
      http:
        paths:
          # API tier — routed straight to the backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          # Presentation tier — everything else goes to the SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
