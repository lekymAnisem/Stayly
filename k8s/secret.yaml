# TEMPLATE ONLY — DO NOT PUT REAL CREDENTIALS IN THIS FILE (it is committed to git).
# Create the real secret directly in the cluster instead, e.g.:
#   kubectl create secret generic stayly-secrets -n stayly --dry-run=client \
#     --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=CLOUDINARY_CLOUD_NAME='<name>' \
#     --from-literal=CLOUDINARY_API_KEY='<key>' \
#     --from-literal=CLOUDINARY_API_SECRET='<secret>' \
#     --from-literal=ADMIN_PASSWORD='<admin-password>' \
#     --from-literal=CLERK_SECRET_KEY='<secret-key>' \
#     -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: stayly-secrets
  namespace: stayly
  labels:
    app.kubernetes.io/name: stayly
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://user:password@host:5432/db?sslmode=require"
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME"
  CLOUDINARY_API_KEY: "CHANGE_ME"
  CLOUDINARY_API_SECRET: "CHANGE_ME"
  ADMIN_PASSWORD: "CHANGE_ME"
  # Optional — used to resolve Clerk user emails server-side. Add from Clerk dashboard.
  CLERK_SECRET_KEY: ""
