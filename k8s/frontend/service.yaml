apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stayly
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: stayly
    tier: presentation
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer