# Credentials are NOT stored in git. The External Secrets Operator syncs them
# from AWS Secrets Manager (secret "stayly-creds") into the cluster Secret
# "stayly-secrets" via IRSA (IAM role stayly-external-secrets).
# Requires the external-secrets operator to be installed in the cluster.
#
# Keys are mapped explicitly (rather than dataFrom.extract) so the synced
# Secret contains exactly the variables the backend consumes, plus a
# placeholder POSTGRES_PASSWORD for the in-cluster postgres StatefulSet.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: stayly-aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stayly-secrets
  namespace: stayly
  labels:
    app.kubernetes.io/name: stayly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: stayly-aws-secrets-manager
  target:
    name: stayly-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        VITE_CLERK_PUBLISHABLE_KEY: "{{ .VITE_CLERK_PUBLISHABLE_KEY }}"
        CLOUDINARY_CLOUD_NAME: "{{ .CLOUDINARY_CLOUD_NAME }}"
        CLOUDINARY_API_KEY: "{{ .CLOUDINARY_API_KEY }}"
        CLOUDINARY_API_SECRET: "{{ .CLOUDINARY_API_SECRET }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        CLERK_SECRET_KEY: "{{ .CLERK_SECRET_KEY }}"
        # The app database is Neon (see DATABASE_URL in the AWS secret);
        # this key only satisfies the in-cluster postgres StatefulSet env.
        POSTGRES_PASSWORD: "change-me-in-production"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: stayly-creds
        property: DATABASE_URL
    - secretKey: VITE_CLERK_PUBLISHABLE_KEY
      remoteRef:
        key: stayly-creds
        property: VITE_CLERK_PUBLISHABLE_KEY
    - secretKey: CLOUDINARY_CLOUD_NAME
      remoteRef:
        key: stayly-creds
        property: CLOUDINARY_CLOUD_NAME
    - secretKey: CLOUDINARY_API_KEY
      remoteRef:
        key: stayly-creds
        property: CLOUDINARY_API_KEY
    - secretKey: CLOUDINARY_API_SECRET
      remoteRef:
        key: stayly-creds
        property: CLOUDINARY_API_SECRET
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: stayly-creds
        property: ADMIN_PASSWORD
    - secretKey: CLERK_SECRET_KEY
      remoteRef:
        key: stayly-creds
        property: CLERK_SECRET_KEY
