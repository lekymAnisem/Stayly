apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stayly
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: stayly
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
        - name: api
          image: stayly-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: stayly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: DATABASE_URL
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: CLOUDINARY_API_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: ADMIN_PASSWORD
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stayly-secrets
                  key: CLERK_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi