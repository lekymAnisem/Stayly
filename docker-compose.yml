name: stayly

# Local 3-tier dev stack: PostgreSQL + API + nginx-served frontend.
# Production deployment lives under k8s/.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stayly
      POSTGRES_USER: stayly
      POSTGRES_PASSWORD: stayly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayly -d stayly"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    # Reads the real secrets (Neon DATABASE_URL, Cloudinary, ADMIN_PASSWORD)
    # from backend/.env. Leave the local `db` service below for offline dev.
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata: