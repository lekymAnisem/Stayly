server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — everything falls back to index.html.
  # Never cache index.html: after a rebuild the JS/CSS asset names change, so
  # a cached HTML would point at a 404 and show a blank page.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Reverse proxy API calls to the backend service (Compose/K8s service DNS "backend")
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-lived asset caching
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}